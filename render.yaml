services:
  - type: web
    name: local-service-insider
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      - type: rewrite
        source: /offer
        destination: /offer.html
      - type: rewrite
        source: /pricing
        destination: /pricing/index.html
      - type: rewrite
        source: /pricing/*
        destination: /pricing/index.html
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: turf-api
    runtime: node
    rootDir: api
    plan: 0.5c-512mb
    buildCommand: corepack pnpm install --frozen-lockfile
    preDeployCommand: node src/migrate.js
    startCommand: node src/server.js
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: turf-db
          property: connectionString
      - key: SMS_ENABLED
        value: 'false'
      - key: EMAIL_ENABLED
        value: 'false'
      - key: META_ENABLED
        value: 'false'
      - key: PUBLIC_SITE_URL
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: TICK_SECRET
        generateValue: true
      - key: MAGIC_LINK_SECRET
        generateValue: true
  - type: cron
    name: turf-tick
    runtime: node
    rootDir: api
    schedule: '*/5 * * * *'
    buildCommand: corepack pnpm install --frozen-lockfile
    startCommand: node src/jobs/tick.js
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: turf-db
          property: connectionString
      - key: API_BASE_URL
        fromService:
          type: web
          name: turf-api
          envVarKey: API_BASE_URL
      - key: TICK_SECRET
        fromService:
          type: web
          name: turf-api
          envVarKey: TICK_SECRET

databases:
  - name: turf-db
    plan: basic-256mb
    databaseName: turf
    user: turf
    ipAllowList: []
