# New isolated preview resources. Upgrade the database before collecting real leads.
services:
  - type: web
    name: phoenix-car-care
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack pnpm install --frozen-lockfile
    startCommand: node server/index.mjs
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: phoenix-car-care-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
databases:
  - name: phoenix-car-care-db
    plan: free
    region: oregon
    databaseName: phoenixcarcare
    user: phoenixcarcare
    ipAllowList: []
